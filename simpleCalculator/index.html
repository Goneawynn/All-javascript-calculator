<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Gate Javascript</title>
    <link rel="stylesheet" href="styles/miniCalc.css">
</head>
<body>
  <header>
    <h2 id="judul">Kalkulator Sederhana.. bangett!</h2>
  </header>
  
  <main>
    <section id="operator">
      <button id="+">+</button> 
      <button id="-">-</button>
      <button id="*">*</button>
      <button id="/">/</button>   
    </section>
   
    <section class="container-input">
      <label for="angka1" class="angka">Angka Pertama:</label><input type="angka1" name="angka1" id="angka1">
      <label for="angka2" class="angka">Angka Kedua:</label><input type="angka2" name="angka2" id="angka2">
      <button id="hitung">Hitung</button>
      <h3 id="jumlah">0</h3>
    </section>
    
  </main>

  <script src="scripts/miniCalc.js" defer></script>
</body>
</html>
