<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Calculator</title>
    <link rel="stylesheet" href="styles/tempCalc.css">
</head>
<body>
    <header class="title">
        <h2>Temperature Converter Calculator</h2>
    </header>

    <main>
        <section id="container-temp">
            <h3>Select Temperature Units</h3>
            <div id="tempLeft">
                <label for="left">Suhu pertama:</label>
                <select name="left" id="left">
                    <option value="celciusLeft">Celcius (°C)</option>
                    <option value="fahrenheitLeft">Fahrenheit (°F)</option>
                    <option value="kelvinsLeft">Kelvin (°K)</option>
                    <option value="reamurLeft">Reamur (°R)</option>
                </select>
                <input type="number" name="valueTemp" id="valueTemp" placeholder="Input the temperature value">
            </div>
            
            <div id="tempRight">
                <label for="left">Suhu pertama:</label>
                <select name="right" id="right">
                    <option value="celciusRight">Celcius (°C)</option>
                    <option value="fahrenheitRight">Fahrenheit (°F)</option>
                    <option value="kelvinsRight">Kelvin (°K)</option>
                    <option value="reamurRight">Reamur (°R)</option>
                </select>
                <button id="calculate">Calculate</button>
                <h3 id="result">78.4</h3>
            </div>
        </section>
    </main>

    <script src="scripts/tempCalc.js" defer></script>
</body>
</html>
